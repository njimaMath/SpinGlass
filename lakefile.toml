name = "SpinGlass"
defaultTargets = ["SpinGlass", "Common"]

# Reuse the parent workspace's installed Lean 4.34 dependencies and mathlib cache.
packagesDir = "../.lake/spinglass/packages"
buildDir = "../.lake/spinglass/build"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

# Exchangeability, the Hewitt-Savage zero-one law and de Finetti's theorem
# used by the overlap-array development.
[[require]]
name = "GibbsMeasure"
git = "https://github.com/matteo-ax/GibbsMeasure.git"
rev = "8a158f018c55665542e071c6c0e54906f903a199"

# Keep mathlib last so its shared versions override transitive requirements.
[[require]]
name = "mathlib"
path = "../.lake/spinglass/packages/mathlib"

[[lean_lib]]
name = "SpinGlass"

[[lean_lib]]
name = "Common"
